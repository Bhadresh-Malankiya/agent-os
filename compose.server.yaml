name: agent-os-server
x-app: &app
  image: agent-os-server:local
  build: .
  restart: unless-stopped
  init: true
  user: node
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  environment: &environment
    DATABASE_URL: postgresql://agent_os:${DB_PASSWORD:?Generate deploy/.env first}@postgres:5432/agent_os
    APP_ORIGIN: http://127.0.0.1:${APP_PORT:-3101}
    COMPOSIO_API_KEY: ${COMPOSIO_API_KEY:-}
    CODEX_BRIEF_MODEL: ${CODEX_BRIEF_MODEL:-gpt-6-sol}
    CODEX_PROFILE_MODEL: ${CODEX_PROFILE_MODEL:-gpt-6-luna}
  volumes:
    - codex_auth:/home/node/.codex
    - private_data:/app/private
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }
services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: agent_os
      POSTGRES_USER: agent_os
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Generate deploy/.env first}
    volumes: ["database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_os -d agent_os"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
  migrate:
    <<: *app
    restart: "no"
    command: ["node", "scripts/migrate.mjs"]
    depends_on:
      postgres: { condition: service_healthy }
  web:
    <<: *app
    ports: ["127.0.0.1:${APP_PORT:-3101}:3100"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "scripts/container-health.mjs", "web"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
  worker:
    <<: *app
    command: ["node", "node_modules/tsx/dist/cli.mjs", "scripts/worker.ts"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "scripts/container-health.mjs", "worker"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
volumes:
  database:
  codex_auth:
  private_data:
