name: agent-os
services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: agent_os
      POSTGRES_USER: agent_os
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run npm run setup first}
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["agent_os_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_os -d agent_os"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  agent_os_pg:
