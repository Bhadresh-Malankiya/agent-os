name: Verify
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: agent_os
          POSTGRES_USER: agent_os
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agent_os -d agent_os"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://agent_os:ci-only-password@127.0.0.1:5432/agent_os
      TEST_DATABASE_URL: postgresql://agent_os:ci-only-password@127.0.0.1:5432/agent_os
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev
  docker:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/docker-setup.mjs
      - run: docker compose --env-file deploy/.env -f compose.server.yaml up -d --build --wait --wait-timeout 180
      - run: APP_ORIGIN=http://127.0.0.1:3101 node scripts/smoke.mjs
      - if: always()
        run: docker compose --env-file deploy/.env -f compose.server.yaml down
